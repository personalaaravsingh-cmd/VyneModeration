name: Install Vyne Index

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract replacement
        run: |
          mkdir -p /tmp/vyne
          unzip -o src/Vyne_index_REPLACEMENT.zip -d /tmp/vyne

          JS_FILE=$(find /tmp/vyne -type f -name "*.js" | head -n 1)

          if [ -z "$JS_FILE" ]; then
            echo "No JavaScript file found in ZIP"
            exit 1
          fi

          cp "$JS_FILE" src/index.js
          rm -f src/Vyne_index_REPLACEMENT.zip

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Replace Vyne index.js" || exit 0
          git push
